services:
  # Backend Spring Boot API Service with Embedded SQLite
  - type: web
    name: 12inch-kot-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /api/products?businessId=1
    envVars:
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true
      - key: SPRING_DATASOURCE_URL
        value: jdbc:sqlite:/app/data/billpro.db

  # Frontend Static Site
  - type: web
    name: 12inch-kot-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: 12inch-kot-backend
          property: host
          value: https://12inch-kot-backend.onrender.com/api

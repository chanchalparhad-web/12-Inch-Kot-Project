server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: billpro-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlite:data/billpro.db}
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.community.dialect.SQLiteDialect
  sql:
    init:
      mode: never

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 Hours

logging:
  level:
    root: INFO
    com.billpro: INFO
